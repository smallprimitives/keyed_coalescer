name: CodeQL

"on":
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ruby, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          # GitHub's organization-managed default setup owns Security tab uploads.
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - name: Require a clean CodeQL scan
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          report="$RUNNER_TEMP/codeql-results/$LANGUAGE.sarif"
          if ! jq -e '(.runs | length > 0) and ([.runs[].results[]?] | length == 0)' "$report" >/dev/null; then
            echo "::error::CodeQL reported findings or did not produce a valid report."
            exit 1
          fi
